<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EU ETS CO2 Price in CHF</title>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        color: rgba(0, 0, 0, 0.8);
        padding: 1rem;
      }

      .card {
        padding: 2.5rem;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }

      .card-title {
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin-bottom: 0.5rem;
        line-height: 1.4;
      }

      .card-subtitle {
        margin-bottom: 2rem;
        opacity: 0.5;
      }

      .price-chf {
        font-size: 3.5rem;
        font-weight: 700;
        line-height: 1;
        margin-bottom: 0.75rem;
      }

      .price-eur {
        margin-bottom: 1.5rem;
        opacity: 0.5;
      }

      .divider {
        border: none;
        border-top: 1px solid rgba(0, 0, 0, 0.1);
        margin: 3rem 0;
      }

      .meta {
        font-size: 0.8rem;
        line-height: 1.8;
        opacity: 0.5;
      }

      .meta .label {
        color: #64748b;
      }

      .loading {
        color: #64748b;
        font-size: 0.95rem;
      }

      .spinner {
        display: inline-block;
        width: 1.25rem;
        height: 1.25rem;
        border: 2px solid #2a2a4a;
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 0.75rem;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .error {
        color: #f87171;
        font-size: 0.95rem;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="loading" class="loading">
        <div class="spinner"></div>
        <div>Fetching current price...</div>
      </div>

      <div id="content" class="hidden">
        <div class="card-title">EU ETS CO2 ALLOWANCES via Compensators</div>
        <div class="card-subtitle">Price per ton</div>
        <div class="price-chf"><span id="chf-value">&mdash;</span> CHF</div>
        <div class="price-eur"><span id="eur-value">&mdash;</span> EUR</div>
        <hr class="divider" />
        <div class="meta">
          <div>
            <span class="label">Exchange rate:</span>
            1 EUR = <span id="rate-value">&mdash;</span> CHF
          </div>
          <div>
            <span class="label">Last updated:</span>
            <span id="updated-value">&mdash;</span>
          </div>
        </div>
      </div>

      <div id="error" class="hidden error">
        Price unavailable. Please try again later.
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const loading = document.getElementById("loading");
        const content = document.getElementById("content");
        const error = document.getElementById("error");

        try {
          const response = await fetch("/api/price");
          if (!response.ok) throw new Error("Request failed");

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          document.getElementById("chf-value").textContent =
            data.priceChf.toFixed(2);
          document.getElementById("eur-value").textContent =
            data.priceEur.toFixed(2);
          document.getElementById("rate-value").textContent =
            data.exchangeRate.toFixed(4);
          document.getElementById("updated-value").textContent =
            new Intl.DateTimeFormat(undefined, {
              dateStyle: "medium",
              timeStyle: "short",
            }).format(new Date(data.fetchedAt));

          loading.classList.add("hidden");
          content.classList.remove("hidden");
        } catch (e) {
          loading.classList.add("hidden");
          error.classList.remove("hidden");
        }
      });
    </script>
  </body>
</html>
